{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cosi-driver-qumulo.serviceAccountName" . }}
  labels:
    {{- include "cosi-driver-qumulo.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.rbac.create }}
{{- if .Values.serviceAccount.create }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cosi-driver-qumulo.fullname" . }}
  labels:
    {{- include "cosi-driver-qumulo.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cosi-driver-qumulo.fullname" . }}
  labels:
    {{- include "cosi-driver-qumulo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cosi-driver-qumulo.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cosi-driver-qumulo.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cosi-driver-qumulo.fullname" . }}
  labels:
    {{- include "cosi-driver-qumulo.labels" . | nindent 4 }}
rules:
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["buckets", "bucketclaims", "bucketclasses", "bucketaccessclasses"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["bucketaccesses"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["buckets/status", "bucketaccesses/status", "bucketclaims/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cosi-driver-qumulo.fullname" . }}
  labels:
    {{- include "cosi-driver-qumulo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cosi-driver-qumulo.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cosi-driver-qumulo.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
