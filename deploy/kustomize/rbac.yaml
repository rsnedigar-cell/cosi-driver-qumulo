apiVersion: v1
kind: ServiceAccount
metadata:
  name: qumulo-cosi-driver
  namespace: qumulo-cosi
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qumulo-cosi-driver
  namespace: qumulo-cosi
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qumulo-cosi-driver
  namespace: qumulo-cosi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qumulo-cosi-driver
subjects:
  - kind: ServiceAccount
    name: qumulo-cosi-driver
    namespace: qumulo-cosi
---
# Sidecar watches cluster-scoped Bucket/BucketAccess and writes app Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qumulo-cosi-driver
rules:
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["buckets", "bucketclaims", "bucketclasses", "bucketaccessclasses"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["bucketaccesses"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["buckets/status", "bucketaccesses/status", "bucketclaims/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qumulo-cosi-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: qumulo-cosi-driver
subjects:
  - kind: ServiceAccount
    name: qumulo-cosi-driver
    namespace: qumulo-cosi
