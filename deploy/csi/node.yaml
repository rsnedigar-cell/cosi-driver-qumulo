apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qumulo-csi-node
  namespace: qumulo-cosi
  labels:
    app.kubernetes.io/name: qumulo-csi
    app.kubernetes.io/component: node
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qumulo-csi
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qumulo-csi
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: qumulo-csi-node
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0@sha256:f9de845b170155199f2a2a3f9531cf13d78e31235e9db6b6582a8b0db0a50dad
          args:
            - --v=2
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/file.qumulo.com/csi.sock
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: socket
              mountPath: /csi
            - name: registration
              mountPath: /registration
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0@sha256:06da0d5b8908072f2e4522692aee8dc119fba7247a9658497e1153992cd777e9
          args:
            - --csi-address=/csi/csi.sock
            - --probe-timeout=3s
            - --http-endpoint=127.0.0.1:9809
            - --v=2
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: socket
              mountPath: /csi
        - name: qumulo-csi-node
          image: ghcr.io/rsnedigar-cell/cosi-driver-qumulo:0.2.0-csi
          imagePullPolicy: IfNotPresent
          command: ["/qumulo-csi-driver"]
          args:
            - --mode=node
            - --driver-address=unix:///csi/csi.sock
            - --node-id=$(NODE_ID)
            - --endpoint=$(QUMULO_ENDPOINT)
            - --data-server=$(QUMULO_DATA_SERVER)
            - --rest-port=$(QUMULO_REST_PORT)
            - --base-path=$(QUMULO_CSI_BASE_PATH)
            - --version-floor=$(QUMULO_VERSION_FLOOR)
            - --kubelet-root=/var/lib/kubelet
            - --handle-key-file=/etc/qumulo/handle-key/key
            - --allowed-networks=$(QUMULO_CSI_ALLOWED_NETWORKS)
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - configMapRef:
                name: qumulo-csi-config
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 9809
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 9809
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: socket
              mountPath: /csi
            - name: kubelet
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: state
              mountPath: /var/lib/qumulo-csi
            - name: handle-key
              mountPath: /etc/qumulo/handle-key
              readOnly: true
      volumes:
        - name: socket
          hostPath:
            path: /var/lib/kubelet/plugins/file.qumulo.com
            type: DirectoryOrCreate
        - name: registration
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: state
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: handle-key
          secret:
            secretName: qumulo-csi-handle-key
            defaultMode: 0400
      terminationGracePeriodSeconds: 30
