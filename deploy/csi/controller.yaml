apiVersion: apps/v1
kind: Deployment
metadata:
  name: qumulo-csi-controller
  namespace: qumulo-cosi
  labels:
    app.kubernetes.io/name: qumulo-csi
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: qumulo-csi
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qumulo-csi
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: qumulo-csi-controller
      automountServiceAccountToken: false
      priorityClassName: system-cluster-critical
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: qumulo-csi
                    app.kubernetes.io/component: controller
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0@sha256:a4b0b1a37605b7b04a293e136edf7006ec1786a8eb3f4e5a945f81d667dcc371
          args:
            - --v=2
            - --csi-address=/csi/csi.sock
            - --leader-election=true
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --extra-create-metadata=true
            - --feature-gates=VolumeAttributesClass=false
            - --timeout=120s
            - --worker-threads=10
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: socket
              mountPath: /csi
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1@sha256:ea1d25e23479000c7e8eeb92d827df66258df4e482ca054c5e7ce3fc0f5c41a5
          args:
            - --v=2
            - --csi-address=/csi/csi.sock
            - --leader-election=true
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --feature-gates=VolumeAttributesClass=false
            - --timeout=120s
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: socket
              mountPath: /csi
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0@sha256:06da0d5b8908072f2e4522692aee8dc119fba7247a9658497e1153992cd777e9
          args:
            - --csi-address=/csi/csi.sock
            - --probe-timeout=3s
            - --http-endpoint=127.0.0.1:9808
            - --v=2
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: socket
              mountPath: /csi
        - name: qumulo-csi-controller
          image: ghcr.io/rsnedigar-cell/cosi-driver-qumulo:0.2.0-csi
          imagePullPolicy: IfNotPresent
          command: ["/qumulo-csi-driver"]
          args:
            - --mode=controller
            - --driver-address=unix:///csi/csi.sock
            - --endpoint=$(QUMULO_ENDPOINT)
            - --data-server=$(QUMULO_DATA_SERVER)
            - --rest-port=$(QUMULO_REST_PORT)
            - --base-path=$(QUMULO_CSI_BASE_PATH)
            - --version-floor=$(QUMULO_VERSION_FLOOR)
            - --handle-key-file=/etc/qumulo/handle-key/key
            - --allowed-networks=$(QUMULO_CSI_ALLOWED_NETWORKS)
          envFrom:
            - configMapRef:
                name: qumulo-csi-config
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - -T
                - "3"
                - -O
                - /dev/null
                - http://127.0.0.1:9808/healthz
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - -T
                - "3"
                - -O
                - /dev/null
                - http://127.0.0.1:9808/healthz
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: socket
              mountPath: /csi
            - name: credentials
              mountPath: /etc/qumulo/credentials
              readOnly: true
            - name: handle-key
              mountPath: /etc/qumulo/handle-key
              readOnly: true
      volumes:
        - name: socket
          emptyDir: {}
        - name: credentials
          secret:
            secretName: qumulo-cosi-creds
            defaultMode: 0440
        - name: handle-key
          secret:
            secretName: qumulo-csi-handle-key
            defaultMode: 0440
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
      terminationGracePeriodSeconds: 30
